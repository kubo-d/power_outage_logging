version: '3.7'

services:
  nginx-auth:
    build: ./nginx
    environment:
      - API_KEY=${REMOTE_LOG_API_KEY}
    depends_on:
      - vector
    restart: unless-stopped

  vector:
    image: timberio/vector:latest-alpine
    command: --config /etc/vector/vector.toml
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector_buffer:/var/lib/vector/buffer
    # Keep internal only; expose via nginx-auth proxy
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - minio-init
    # Internal only
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
        sleep 5;
        mc alias set minio http://minio:9000 minioadmin minioadmin &&
        mc mb minio/loki --ignore-existing &&
        mc policy set public minio/loki || true;
        exit 0
      '
    restart: "no"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.5.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    # Optional: if you want Grafana exposed through Coolify you can remove the comment
    # and let Coolify map a domain to this service rather than publishing the port directly
    depends_on:
      - loki
    restart: unless-stopped

  heartbeat-monitor:
    build: ./heartbeat-monitor
    environment:
      - LOKI_URL=http://loki:3100
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN}
      - HEARTBEAT_THRESHOLD_MIN=15
      - POLL_INTERVAL_SEC=60
      - QUERY_WINDOW_HOURS=24
      - LOKI_QUERY_LIMIT=5000
      - LOKI_TIMEOUT_SEC=20
    depends_on:
      - loki
    volumes:
      - heartbeat_state:/data
    restart: unless-stopped

volumes:
  vector_buffer:
    driver: local
  minio_data:
    driver: local
  grafana_data:
    driver: local
  heartbeat_state:
    driver: local
