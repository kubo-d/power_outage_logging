# Vector config: HTTP source -> remap label -> Loki sink

[sources.http_logs]
type = "http_server"
address = "0.0.0.0:8686"
encoding = "json"

[transforms.labeler]
type = "remap"
inputs = ["http_logs"]
# Create loki labels using device_id and optional tags, and set event timestamp safely
source = '''
  if (!exists(.device_id)) {
    .device_id = "unknown"
  }
  if (!exists(.type)) {
    .type = "unknown"
  }
  if (!exists(.hostname)) {
    .hostname = "unknown"
  }

  if (exists(.timestamp)) {
    tsi = to_int(.timestamp) ?? 0
    if (tsi > 0) {
      # Detect milliseconds vs seconds using a safe threshold
      if (tsi > 10000000000) {
        .timestamp = from_unix_timestamp!(tsi, "milliseconds")
      } else {
        .timestamp = from_unix_timestamp!(tsi)
      }
    }
  }
'''

[sinks.loki]
type = "loki"
inputs = ["labeler"]
endpoint = "http://loki:3100"
encoding.codec = "json"
  [sinks.loki.buffer]
  type = "disk"
  max_size = 268435488
  when_full = "block"
  [sinks.loki.labels]
  device_id = "{{ device_id }}"
  type = "{{ type }}"
  hostname = "{{ hostname }}"
  app = "power-outage"

[api]
enabled = true
address = "0.0.0.0:8687"
