# Vector config: HTTP source -> remap label -> Loki sink

[sources.http_logs]
type = "http_server"
address = "0.0.0.0:8686"
encoding = "json"

[transforms.labeler]
type = "remap"
inputs = ["http_logs"]
# Create loki labels using device_id and optional tags
source = '''
  if (!exists(.device_id)) {
    .device_id = "unknown"
  }
  if (!exists(.type)) {
    .type = "unknown"
  }
  if (!exists(.hostname)) {
    .hostname = "unknown"
  }

  # Use payload 'timestamp' as event timestamp when available
  if (exists(.timestamp)) {
    ts = .timestamp
    if (is_integer(ts)) {
      # Detect milliseconds vs seconds
      if (ts > 10000000000) {
        .timestamp = to_timestamp(ts / 1000)
      } else {
        .timestamp = to_timestamp(ts)
      }
    } else if (is_string(ts)) {
      parsed, err = parse_timestamp(ts)
      if (err == null) {
        .timestamp = parsed
      }
    }
  }
'''

[sinks.loki]
type = "loki"
inputs = ["labeler"]
endpoint = "http://loki:3100"
encoding.codec = "json"
  [sinks.loki.buffer]
  type = "disk"
  max_size = 268435488
  when_full = "block"
  [sinks.loki.labels]
  device_id = "{{ device_id }}"
  type = "{{ type }}"
  hostname = "{{ hostname }}"
  app = "power-outage"

[api]
enabled = true
address = "0.0.0.0:8687"
